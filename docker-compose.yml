services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined at build time; sourced from .env (NEXT_PUBLIC_API_URL).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: fe-senja-nextjs
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - next_cache:/app/.next/cache
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const p=process.env.PORT||3000;require('http').get('http://127.0.0.1:'+p+'/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  next_cache:
